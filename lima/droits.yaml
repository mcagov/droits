minimumLimaVersion: "2.2.0"

base:
  - template:_images/ubuntu-lts
  - template:_default/mounts

containerd:
  system: false
  user: false

vmType: vz
mountType: virtiofs

cpus: 4
memory: 8GiB
disk: 40GiB

mountInotify: true

mounts: []

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      apt-get update
      apt-get install -y --no-install-recommends make git curl unzip ca-certificates build-essential libicu-dev
      apt-get install -y podman podman-compose uidmap dbus-user-session passt
      mkdir -p /etc/containers/registries.conf.d
      echo 'unqualified-search-registries = ["docker.io"]' > /etc/containers/registries.conf.d/00-droits.conf
  - mode: user
    script: |
      #!/bin/bash
      set -eux -o pipefail
      if ! [ -x "$HOME/.local/bin/mise" ]; then
        curl -fsSL https://mise.run | sh
      fi
      if ! grep -q "mise/shims" "$HOME/.profile" 2>/dev/null; then
        echo 'export PATH="$HOME/.local/share/mise/shims:$HOME/.local/bin:$PATH"' >> "$HOME/.profile"
      fi
      "$HOME/.local/bin/mise" settings set idiomatic_version_file_enable_tools "[]" || true

message: |
  The Droits VM is ready. Use ./scripts/dev.sh from the repository on your Mac.
