services:
  backoffice:
    container_name: droits_backoffice
    build:
      context: ./backoffice
    image: droits-backoffice
    ports:
      # Todo: Resolve the following issue when trying to submit a wreck report "droits_webapp      | [0] Issue submitting droit report: ECONNREFUSED - post - http://127.0.0.1:5001/Api/SubmitDroit"
      # Using port 5001 on the host to avoid a port conflict
      - "5001:5000"
    environment:
      ASPNETCORE_Kestrel__Certificates__Default__Password: "password"
      ASPNETCORE_Kestrel__Certificates__Default__Path: "/https/aspnetapp.pfx"
      ASPNETCORE_ENVIRONMENT: "Development"
      SEED_DATABASE: "true"
      DB_HOST: 'database'
    volumes:
      - ~/.aspnet/https:/https:ro
    depends_on:
      database:
        condition: service_healthy

  webapp:
    container_name: droits_webapp
    build:
      context: ./webapp
    image: droits-webapp
    environment:
      REDIS_HOST: 'redis'
    ports:
      - "3000:3000"
    depends_on:
      - backoffice
      - redis

  database:
    image: docker.io/library/postgres:14-alpine
    container_name: droits_database
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: droits
      POSTGRES_USER: service
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U service -d droits"]
      interval: 5s
      retries: 5

  redis:
    image: docker.io/library/redis:7
    container_name: droits_redis
    ports:
      - "6379:6379"

  localstack:
    image: docker.io/localstack/localstack:4.14.0
    container_name: droits_localstack
    profiles: ["local-auth"]
    environment:
      SERVICES: s3
      BUCKET_NAME: ${AWS__S3Config__BucketName:-droits-local}
    ports:
      - "4566:4566"
    volumes:
      - ./localstack/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh:ro

volumes:
  pgdata:
